# Cloudflare Pages configuration
name = "proyecto-flor"
type = "javascript"
compatibility_date = "2024-01-01"

# Build configuration
[build]
command = "dotnet publish -c Release -o publish"
cwd = "ProyectoFlor"

# Output directory (where Cloudflare Pages will serve files from)
[build.upload]
directory = "ProyectoFlor/publish/wwwroot"

# Cache configuration
[env.production]
name = "Production"
branch = "main"

# Rewrite rules for SPA (important for Blazor routing)
[[routes]]
pattern = "/*"
status = 200
path = "/index.html"
