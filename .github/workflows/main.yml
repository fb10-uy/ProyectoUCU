name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build and Publish to Cloudflare Pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore
        working-directory: ProyectoFlor

      - name: Build project
        run: dotnet build -c Release --no-restore
        working-directory: ProyectoFlor

      - name: Publish WebAssembly app
        run: dotnet publish -c Release -o ../publish --no-build
        working-directory: ProyectoFlor

      - name: List publish output (debug)
        run: ls -la ProyectoFlor/publish/wwwroot/
        shell: bash

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: proyecto-ucu
          directory: ProyectoFlor/publish/wwwroot
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          wranglerVersion: '4'
