name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build and Publish to Cloudflare Pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore
        working-directory: ProyectoFlor

      - name: Build project
        run: dotnet build -c Release --no-restore
        working-directory: ProyectoFlor

      - name: Publish WebAssembly app
        run: dotnet publish -c Release -o ../publish --no-build
        working-directory: ProyectoFlor

      - name: List publish output (debug)
        run: ls -la ProyectoFlor/publish/wwwroot/
        shell: bash

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Publish with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages publish ProyectoFlor/publish/wwwroot \
            --project-name proyecto-ucu \
            --branch main
